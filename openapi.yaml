openapi: 3.0.3
info:
  title: ChatBizz API
  version: 1.0.0
  description: Swagger documentation for APIs defined in `routes/api.php`.

servers:
  - url: /api
    description: Laravel API base path

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Driver
  - name: Orders
  - name: Payments
  - name: Cart
  - name: Addresses
  - name: Merchant
  - name: Products
  - name: Categories
  - name: Notifications
  - name: Chat
  - name: Static Pages
  - name: Ads

paths:
  /user:
    get:
      tags: [Auth]
      summary: Get authenticated user
      responses:
        '200':
          $ref: '#/components/responses/AuthenticatedUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /logout:
    post:
      tags: [Auth]
      summary: Logout authenticated user
      responses:
        '200':
          $ref: '#/components/responses/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /delvery-boy/login:
    post:
      tags: [Auth, Driver]
      security: []
      summary: Driver login
      requestBody:
        $ref: '#/components/requestBodies/DriverLoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/DriverLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/login:
    post:
      tags: [Auth, Merchant]
      security: []
      summary: Merchant Firebase login
      requestBody:
        $ref: '#/components/requestBodies/MerchantFirebaseLoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/MerchantLoginResponse'
        '401':
          $ref: '#/components/responses/MerchantLoginUnauthorizedResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /user/verifyOtp:
    post:
      tags: [Auth, Merchant]
      security: []
      summary: Verify merchant OTP
      requestBody:
        $ref: '#/components/requestBodies/MerchantVerifyOtpRequest'
      responses:
        '200':
          $ref: '#/components/responses/MerchantOtpVerifiedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /delvery-boy/profile:
    get:
      tags: [Driver]
      summary: Driver profile and dashboard stats
      responses:
        '200':
          $ref: '#/components/responses/DriverProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /delvery-boy/orders:
    get:
      tags: [Driver, Orders]
      summary: List driver orders
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DriverOrdersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /delvery-boy/services:
    get:
      tags: [Driver]
      summary: List driver service requests
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DriverServicesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /delvery-boy/updateStatus:
    get:
      tags: [Driver]
      summary: Toggle driver availability status
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /delvery-boy/accept-order:
    post:
      tags: [Driver, Orders]
      summary: Accept and assign driver to order
      requestBody:
        $ref: '#/components/requestBodies/AcceptOrderRequest'
      responses:
        '200':
          $ref: '#/components/responses/DriverAcceptOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /delvery-boy/accept-service:
    post:
      tags: [Driver]
      summary: Accept and assign driver to service
      requestBody:
        $ref: '#/components/requestBodies/AcceptServiceRequest'
      responses:
        '200':
          $ref: '#/components/responses/DriverAcceptServiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /delvery-boy/save-driver-device-token:
    post:
      tags: [Driver, Notifications]
      summary: Save driver device token
      requestBody:
        $ref: '#/components/requestBodies/SaveDeviceTokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/SaveTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /delvery-boy/order/{orderId}:
    get:
      tags: [Driver, Orders]
      summary: Get driver order details
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/DriverOrderDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /delvery-boy/update-order-status:
    post:
      tags: [Driver, Orders]
      summary: Update order status (driver flow)
      requestBody:
        $ref: '#/components/requestBodies/OrderStatusUpdate'
      responses:
        '200':
          $ref: '#/components/responses/OrderStatusUpdatedResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /delvery-boy/update-service-status:
    post:
      tags: [Driver]
      summary: Update service status (driver flow)
      requestBody:
        $ref: '#/components/requestBodies/ServiceStatusUpdate'
      responses:
        '200':
          $ref: '#/components/responses/ServiceStatusUpdatedResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /delvery-boy/update-location:
    post:
      tags: [Driver]
      summary: Update live driver location
      requestBody:
        $ref: '#/components/requestBodies/DriverLocationUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/DriverLocationUpdatedResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /delvery-boy/orders/{order}/regenerate-otp:
    post:
      tags: [Driver, Orders]
      summary: Regenerate completion OTP for an order
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/RegenerateOtpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /delvery-boy/delivery-chat-send:
    post:
      tags: [Chat]
      summary: Send delivery chat message (driver-prefixed route)
      requestBody:
        $ref: '#/components/requestBodies/DeliveryChatSend'
      responses:
        '200':
          $ref: '#/components/responses/ChatSendResponse'

  /delivery-chat-send:
    post:
      tags: [Chat]
      summary: Send delivery chat message
      requestBody:
        $ref: '#/components/requestBodies/DeliveryChatSend'
      responses:
        '200':
          $ref: '#/components/responses/ChatSendResponse'

  /delvery-boy/service-chat-send:
    post:
      tags: [Chat]
      summary: Send service chat message (driver-prefixed route)
      requestBody:
        $ref: '#/components/requestBodies/ServiceChatSend'
      responses:
        '200':
          $ref: '#/components/responses/ServiceChatSendResponse'

  /service-chat-send:
    post:
      tags: [Chat]
      summary: Send service chat message
      requestBody:
        $ref: '#/components/requestBodies/ServiceChatSend'
      responses:
        '200':
          $ref: '#/components/responses/ServiceChatSendResponse'

  /order/{orderId}:
    get:
      tags: [Orders]
      summary: Get authenticated user order details
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/UserOrderDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /cart:
    post:
      tags: [Cart]
      summary: Add product to cart
      requestBody:
        $ref: '#/components/requestBodies/AddToCartRequest'
      responses:
        '200':
          $ref: '#/components/responses/CartMessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Cart]
      summary: Get authenticated user cart
      responses:
        '200':
          $ref: '#/components/responses/CartListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cart/{cartId}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      parameters:
        - $ref: '#/components/parameters/CartId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateCartRequest'
      responses:
        '200':
          $ref: '#/components/responses/CartMessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Cart]
      summary: Remove cart item
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          $ref: '#/components/responses/CartRemoveResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /order:
    post:
      tags: [Orders]
      summary: Create order from cart
      responses:
        '200':
          $ref: '#/components/responses/CreateOrderFromCartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /update-order-status:
    post:
      tags: [Orders]
      summary: Update order status
      requestBody:
        $ref: '#/components/requestBodies/OrderStatusUpdate'
      responses:
        '200':
          $ref: '#/components/responses/OrderStatusUpdatedResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /update-service-status:
    post:
      tags: [Orders]
      summary: Update service status
      requestBody:
        $ref: '#/components/requestBodies/ServiceStatusUpdate'
      responses:
        '200':
          $ref: '#/components/responses/ServiceStatusUpdatedResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /orders:
    post:
      tags: [Orders]
      summary: Create order and Razorpay order id
      requestBody:
        $ref: '#/components/requestBodies/CreateRazorpayOrderRequest'
      responses:
        '200':
          $ref: '#/components/responses/CreateRazorpayOrderResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Orders]
      summary: List authenticated user orders
      responses:
        '200':
          $ref: '#/components/responses/UserOrdersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/verify-payment:
    post:
      tags: [Orders]
      summary: Verify Razorpay order payment
      requestBody:
        $ref: '#/components/requestBodies/VerifyPaymentRequest'
      responses:
        '200':
          $ref: '#/components/responses/PaymentVerificationResponse'
        '400':
          $ref: '#/components/responses/PaymentVerificationFailedResponse'

  /service-requests:
    get:
      tags: [Orders]
      summary: List authenticated user service requests
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/UserServiceRequestsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /service-requests/create-with-razorpay:
    post:
      tags: [Orders]
      summary: Create service request with Razorpay order
      requestBody:
        $ref: '#/components/requestBodies/CreateServiceRequest'
      responses:
        '200':
          $ref: '#/components/responses/CreateServiceRequestResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /service-requests/verify-payment:
    post:
      tags: [Orders]
      summary: Verify service payment signature
      requestBody:
        $ref: '#/components/requestBodies/VerifyPaymentRequest'
      responses:
        '200':
          $ref: '#/components/responses/PaymentVerificationResponse'
        '400':
          $ref: '#/components/responses/PaymentVerificationFailedResponse'

  /payments/cashfree/create-order:
    post:
      tags: [Orders, Payments]
      summary: Create order and Cashfree payment session
      requestBody:
        $ref: '#/components/requestBodies/CreateCashfreeOrderRequest'
      responses:
        '200':
          $ref: '#/components/responses/CreateCashfreeOrderResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/CashfreeActionFailedResponse'

  /payments/cashfree/verify:
    post:
      tags: [Orders, Payments]
      summary: Verify Cashfree payment for an order
      requestBody:
        $ref: '#/components/requestBodies/VerifyCashfreePaymentRequest'
      responses:
        '200':
          $ref: '#/components/responses/VerifyCashfreePaymentResponse'
        '400':
          $ref: '#/components/responses/CashfreePaymentNotSuccessfulResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/CashfreeActionFailedResponse'

  /payments/cashfree/webhook:
    post:
      tags: [Payments]
      summary: Process Cashfree payment webhook
      requestBody:
        $ref: '#/components/requestBodies/CashfreeWebhookRequest'
      responses:
        '200':
          $ref: '#/components/responses/CashfreeWebhookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/CashfreeInvalidWebhookResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/CashfreeActionFailedResponse'

  /orders/{orderId}/mark-delivered:
    post:
      tags: [Orders, Payments]
      summary: Mark order as delivered and trigger rider payout
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/MarkDeliveredResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /addresses:
    get:
      tags: [Addresses]
      summary: List addresses for authenticated user
      responses:
        '200':
          $ref: '#/components/responses/AddressesResponse'
    post:
      tags: [Addresses]
      summary: Create address for authenticated user
      requestBody:
        $ref: '#/components/requestBodies/AddressRequest'
      responses:
        '201':
          $ref: '#/components/responses/AddressResponseCreated'

  /addresses/{id}:
    put:
      tags: [Addresses]
      summary: Update address
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/AddressRequest'
      responses:
        '200':
          $ref: '#/components/responses/AddressResponse'
    delete:
      tags: [Addresses]
      summary: Delete address
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/AddressDeletedResponse'

  /addresses/{id}/primary:
    put:
      tags: [Addresses]
      summary: Mark address as primary
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/AddressResponse'

  /merchant/add-products:
    post:
      tags: [Merchant, Products]
      summary: Add or update merchant product mappings
      requestBody:
        $ref: '#/components/requestBodies/MerchantAddProductsRequest'
      responses:
        '200':
          $ref: '#/components/responses/MerchantAddProductsResponse'

  /merchant/products:
    post:
      tags: [Merchant, Products]
      summary: List products for authenticated merchant
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/MerchantProductsResponse'

  /merchant/{merchantId}/products:
    get:
      tags: [Merchant, Products]
      security: []
      summary: List products by merchant id
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/ProductsByMerchantResponse'

  /categories-with-subcategories:
    get:
      tags: [Categories]
      summary: Categories with subcategories and available products for merchant
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/CategoriesWithSubcategoriesResponse'

  /categories-with-merchants:
    get:
      tags: [Categories]
      security: []
      summary: Categories with active merchants
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/CategoriesWithMerchantsResponse'

  /merchant/dashboard:
    get:
      tags: [Merchant]
      summary: Merchant dashboard metrics
      parameters:
        - name: recent_limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/MerchantDashboardResponse'

  /merchant/orders:
    get:
      tags: [Merchant, Orders]
      summary: Merchant orders list
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/MerchantOrdersResponse'

  /merchant/orders/{orderId}:
    get:
      tags: [Merchant, Orders]
      summary: Merchant order details
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/MerchantOrderDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /merchant/settlements:
    get:
      tags: [Merchant]
      summary: Merchant settlement orders breakdown
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/MerchantSettlementsResponse'

  /merchant/profile:
    get:
      tags: [Merchant]
      summary: Get authenticated merchant profile
      responses:
        '200':
          $ref: '#/components/responses/MerchantProfileResponse'
    post:
      tags: [Merchant]
      summary: Update authenticated merchant profile
      requestBody:
        $ref: '#/components/requestBodies/MerchantProfileUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/MerchantProfileUpdatedResponse'

  /user/account:
    delete:
      tags: [Merchant]
      summary: Delete authenticated merchant account
      responses:
        '200':
          $ref: '#/components/responses/DeleteAccountResponse'

  /products:
    get:
      tags: [Products]
      security: []
      summary: Get all products
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/ProductsResponse'

  /catalog:
    get:
      tags: [Products]
      security: []
      summary: Get product catalog excluding products already added by merchant
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: cat_id
          in: query
          schema:
            type: integer
        - name: subcat_id
          in: query
          schema:
            type: integer
        - name: merchant_id
          in: query
          description: Merchant whose already-added products should be excluded.
          schema:
            type: integer
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/CatalogResponse'

  /merchants:
    get:
      tags: [Merchant]
      security: []
      summary: Get merchants list
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/MerchantsResponse'

  /merchant-category/{categoryId}/merchants:
    get:
      tags: [Merchant]
      security: []
      summary: Get active merchants by merchant category
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/MerchantsResponse'

  /search-products:
    get:
      tags: [Products]
      security: []
      summary: Search merchant products with category filters
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: cat_id
          in: query
          schema:
            type: integer
        - name: subcat_id
          in: query
          schema:
            type: integer
        - name: merchant_id
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/SearchProductsResponse'

  /getCharges:
    get:
      tags: [Orders]
      security: []
      summary: Get charge settings and merchant coordinates
      parameters:
        - name: shopId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/GetChargesResponse'

  /save-device-token:
    post:
      tags: [Notifications]
      summary: Save customer device token
      requestBody:
        $ref: '#/components/requestBodies/SaveDeviceTokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/SaveTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notify-user:
    post:
      tags: [Notifications]
      summary: Send notification to current user token
      requestBody:
        $ref: '#/components/requestBodies/NotifyUserRequest'
      responses:
        '200':
          $ref: '#/components/responses/NotifyUserResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /notify-all:
    post:
      tags: [Notifications]
      summary: Broadcast notification by user type
      requestBody:
        $ref: '#/components/requestBodies/NotifyAllRequest'
      responses:
        '200':
          $ref: '#/components/responses/NotifyAllResponse'

  /static-pages:
    get:
      tags: [Static Pages]
      security: []
      summary: List static pages
      responses:
        '200':
          $ref: '#/components/responses/StaticPagesResponse'

  /static-pages/{slug}:
    get:
      tags: [Static Pages]
      security: []
      summary: Get static page by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/StaticPageResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /ads:
    get:
      tags: [Ads]
      security: []
      summary: Get active mobile ads
      responses:
        '200':
          $ref: '#/components/responses/ActiveAdsResponse'

  /adds:
    get:
      tags: [Ads]
      security: []
      summary: Get active mobile ads
      description: Alias for `/ads`.
      responses:
        '200':
          $ref: '#/components/responses/ActiveAdsResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
    CartId:
      name: cartId
      in: path
      required: true
      schema:
        type: integer
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1

  requestBodies:
    DriverLoginRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
    MerchantFirebaseLoginRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [idToken]
            properties:
              idToken:
                type: string
    MerchantVerifyOtpRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [mobile, otp]
            properties:
              mobile:
                type: string
              otp:
                type: string
    AcceptOrderRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [order_id]
            properties:
              order_id:
